name: tests and evals

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Backend unit tests
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  evals:
    # Only on pushes, and only when the prompt or eval set changed.
    if: github.event_name == 'push'
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for prompt or eval changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch has no "before" commit, so run the evals to be safe.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -qE '^(backend/prompts/|evals/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24

      - name: Run evals
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm ci
          npm run eval
